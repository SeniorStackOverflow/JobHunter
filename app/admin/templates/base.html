<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/admin-assets/favicon.svg" type="image/svg+xml">
  <title>{% block title %}JobHunter{% endblock %}</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{
      --bg:#f4f6fa;--panel:#fff;--panel-2:#f8fafc;--panel-3:#eef2f7;
      --text:#172033;--muted:#657087;--muted-2:#8d97aa;--border:#dfe4ec;
      --accent:#5b5df0;--accent-2:#7b61ff;--accent-soft:#eeefff;
      --success:#168a5b;--success-soft:#e7f7f0;--warning:#b66a0a;--warning-soft:#fff3dc;
      --danger:#c63d4b;--danger-soft:#ffebee;--info:#3474c8;--info-soft:#e9f2ff;
      --shadow:0 12px 35px rgba(24,36,64,.08);--shadow-sm:0 5px 18px rgba(24,36,64,.07);
      --radius:18px;--radius-sm:12px;--sidebar:256px;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    html[data-theme="dark"]{
      --bg:#0c111b;--panel:#121925;--panel-2:#171f2d;--panel-3:#202a3a;
      --text:#edf2fa;--muted:#a3adbf;--muted-2:#748096;--border:#273244;
      --accent:#8b8df8;--accent-2:#a282ff;--accent-soft:#25264d;
      --success:#55d49b;--success-soft:#15392d;--warning:#f2b75c;--warning-soft:#3b2d18;
      --danger:#ff7f8a;--danger-soft:#43232a;--info:#79b5ff;--info-soft:#1b304c;
      --shadow:0 18px 46px rgba(0,0,0,.28);--shadow-sm:0 8px 24px rgba(0,0,0,.18)
    }
    html{background:var(--bg);scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    code,pre{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}

    .app-shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;padding:20px 16px;border-right:1px solid var(--border);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(18px);display:flex;flex-direction:column;z-index:30}
    .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
    .brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;font-weight:900;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 28%,transparent)}
    .brand-copy strong{display:block;font-size:15px;letter-spacing:.01em}.brand-copy span{font-size:11px;color:var(--muted)}
    .nav-caption{padding:11px 10px 7px;color:var(--muted-2);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
    .side-nav{display:grid;gap:4px}
    .nav-link{display:flex;align-items:center;gap:11px;border-radius:11px;padding:10px 11px;color:var(--muted);font-weight:650;transition:.16s ease}
    .nav-link:hover{background:var(--panel-2);color:var(--text)}
    .nav-link.is-active{background:var(--accent-soft);color:var(--accent)}
    .nav-icon{width:20px;text-align:center;font-size:16px;opacity:.95}
    .nav-count{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:20px;background:var(--panel-3);display:grid;place-items:center;font-size:10px;color:var(--muted)}
    .sidebar-spacer{flex:1}
    .sidebar-status{margin-top:16px;padding:12px;border:1px solid var(--border);background:var(--panel-2);border-radius:13px}
    .sidebar-status-row{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}
    .sidebar-status-row strong{color:var(--text)}
    .sidebar-footer{display:flex;gap:8px;margin-top:12px}.sidebar-footer form{flex:1;margin:0}

    .workspace{min-width:0}
    .topbar{height:72px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
    .topbar-title{min-width:0}.topbar-title strong{display:block;font-size:15px}.topbar-title span{display:block;color:var(--muted);font-size:11px;margin-top:1px}
    .topbar-actions{display:flex;align-items:center;gap:8px}
    .content{padding:28px 30px 48px;max-width:1580px;margin:0 auto}
    .admin-section{display:none;animation:section-in .18s ease}.admin-section.is-active{display:block}
    @keyframes section-in{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
    .section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 22px}
    .section-heading h1{font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.025em}.section-heading p{margin:0;color:var(--muted);max-width:760px}
    .section-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

    .grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-6{grid-template-columns:repeat(6,minmax(0,1fr))}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
    .panel-pad{padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 20px;border-bottom:1px solid var(--border)}
    .panel-title{font-size:14px;font-weight:800}.panel-subtitle{font-size:11px;color:var(--muted);margin-top:2px}
    .metric-card{position:relative;min-height:118px;padding:17px;border:1px solid var(--border);background:linear-gradient(145deg,var(--panel),var(--panel-2));border-radius:16px;overflow:hidden}
    .metric-card::after{content:"";position:absolute;right:-25px;top:-34px;width:100px;height:100px;border-radius:50%;background:color-mix(in srgb,var(--accent) 7%,transparent)}
    .metric-label{font-size:11px;color:var(--muted);font-weight:700}.metric-value{font-size:28px;line-height:1;font-weight:850;letter-spacing:-.035em;margin-top:14px}.metric-note{font-size:10px;color:var(--muted);margin-top:8px}
    .metric-split{display:flex;align-items:flex-end;gap:8px}.metric-split small{font-size:14px;color:var(--muted);padding-bottom:2px}
    .progress{height:6px;background:var(--panel-3);border-radius:99px;overflow:hidden;margin-top:10px}.progress>span{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));max-width:100%}

    .status-strip{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--panel);margin-bottom:16px}
    .status-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--muted-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--muted-2) 10%,transparent)}
    .status-dot.success{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 12%,transparent)}
    .status-dot.warning{background:var(--warning);box-shadow:0 0 0 4px color-mix(in srgb,var(--warning) 12%,transparent)}
    .status-dot.danger{background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 12%,transparent)}
    .status-strip strong{font-size:12px}.status-strip span{color:var(--muted);font-size:11px}.status-strip .push{margin-left:auto}

    .badge{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.02em;white-space:nowrap;background:var(--panel-3);color:var(--muted)}
    .badge.success{background:var(--success-soft);color:var(--success)}.badge.warning{background:var(--warning-soft);color:var(--warning)}.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.muted{background:var(--panel-3);color:var(--muted)}
    .badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

    .btn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:750;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;transition:.15s ease;white-space:nowrap}
    .btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:var(--shadow-sm)}
    .btn:active{transform:none}.btn-primary{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}.btn-danger{border-color:color-mix(in srgb,var(--danger) 25%,var(--border));background:var(--danger-soft);color:var(--danger)}.btn-warning{border-color:color-mix(in srgb,var(--warning) 25%,var(--border));background:var(--warning-soft);color:var(--warning)}.btn-ghost{background:transparent}.btn-sm{min-height:30px;padding:5px 9px;font-size:10px}.btn-icon{width:36px;padding:0}
    .mobile-menu{display:none}

    form{margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .full{grid-column:1/-1}
    label.field{display:grid;gap:6px;font-size:11px;color:var(--muted);font-weight:700}.field-help{font-weight:500;color:var(--muted-2);font-size:10px}
    input[type="text"],input[type="email"],input[type="password"],input[type="number"],input[type="file"],textarea,select{width:100%;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:10px;padding:10px 11px;outline:none;transition:.15s ease}
    input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);background:var(--panel)}
    input[type="file"]{padding:8px}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--panel-2)}
    .switch-copy strong{display:block;font-size:11px}.switch-copy span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.switch{position:relative;width:42px;height:24px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.switch-ui{position:absolute;inset:0;border-radius:999px;background:var(--panel-3);border:1px solid var(--border);transition:.18s}.switch-ui::after{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:var(--muted-2);transition:.18s}.switch input:checked+.switch-ui{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}.switch input:checked+.switch-ui::after{transform:translateX(18px);background:var(--accent)}
    .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

    .table-tools{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel-2)}
    .table-search{position:relative;max-width:360px;flex:1}.table-search input{padding-left:31px;background:var(--panel)}.table-search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);color:var(--muted-2);z-index:1;font-size:16px}
    .table-wrap{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;min-width:720px}th{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:850;background:var(--panel-2);text-align:left}th,td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:color-mix(in srgb,var(--accent) 3%,transparent)}
    .cell-title{font-weight:750;font-size:12px}.cell-meta{font-size:10px;color:var(--muted);margin-top:3px}.cell-muted{color:var(--muted);font-size:11px}.cell-actions{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap}.truncate{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .score{display:flex;align-items:center;gap:8px}.score-number{font-size:14px;font-weight:850;min-width:28px}.score-track{width:64px;height:5px;border-radius:9px;background:var(--panel-3);overflow:hidden}.score-track span{display:block;height:100%;background:var(--accent);border-radius:inherit;max-width:100%}

    .source-card{padding:16px;border:1px solid var(--border);background:var(--panel);border-radius:15px;display:flex;align-items:flex-start;gap:14px}.source-main{min-width:0;flex:1}.source-main h3{font-size:13px;margin:0 0 4px}.source-main p{margin:0;color:var(--muted);font-size:10px;word-break:break-all}.source-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.source-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .alert-card{padding:13px 14px;border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:11px;background:var(--panel-2);margin-bottom:8px}.alert-card.danger{border-left-color:var(--danger)}.alert-card strong{font-size:11px}.alert-card p{font-size:10px;color:var(--muted);margin:3px 0 0}.empty-state{padding:36px;text-align:center;color:var(--muted)}
    .activity-list{display:grid}.activity-item{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}.activity-item:last-child{border-bottom:0}.activity-time{font-size:10px;color:var(--muted)}.activity-title{font-size:11px;font-weight:700}.activity-meta{font-size:10px;color:var(--muted);margin-top:2px}
    .control-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:16px;margin-bottom:16px}.attention-list{display:grid}.attention-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}.attention-item:last-child{border-bottom:0}.attention-signal{width:8px;height:8px;border-radius:50%;background:var(--warning)}.attention-signal.danger{background:var(--danger)}.attention-signal.success{background:var(--success)}.attention-copy strong{display:block;font-size:12px}.attention-copy span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.control-rows{display:grid;gap:10px}.control-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}.control-row:last-child{padding-bottom:0;border-bottom:0}.control-row span:first-child{color:var(--muted);font-size:11px}.identity-line{display:flex;align-items:center;gap:9px}.identity-avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:900}.identity-copy strong{display:block;font-size:11px}.identity-copy span{display:block;color:var(--muted);font-size:9px;margin-top:1px}
    details{border:1px solid var(--border);border-radius:12px;background:var(--panel-2);overflow:hidden}summary{cursor:pointer;padding:12px 14px;font-weight:750;font-size:11px}details>pre,details>.details-body{margin:0;padding:14px;border-top:1px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:10px;max-height:420px;overflow:auto}
    .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;color:var(--muted)}
    .notice{padding:13px 15px;border-radius:12px;border:1px solid var(--border);background:var(--panel-2);font-size:11px}.notice.success{border-color:color-mix(in srgb,var(--success) 25%,var(--border));background:var(--success-soft);color:var(--success)}.notice.warning{border-color:color-mix(in srgb,var(--warning) 25%,var(--border));background:var(--warning-soft);color:var(--warning)}.notice.danger{border-color:color-mix(in srgb,var(--danger) 25%,var(--border));background:var(--danger-soft);color:var(--danger)}

    .login-page{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 35%),radial-gradient(circle at 90% 85%,color-mix(in srgb,var(--accent-2) 10%,transparent),transparent 34%),var(--bg)}
    .login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
    .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.login-brand .brand-mark{width:44px;height:44px}.login-card h1{font-size:22px;margin:0 0 5px}.login-card>p{color:var(--muted);margin:0 0 22px}.login-card .field{margin-bottom:13px}.login-card .btn{width:100%;margin-top:5px;min-height:42px}
    .google-button{background:#fff;color:#1f1f1f;border-color:#d7dbe2;font-size:12px}.google-button:hover{border-color:#b9c0cc}.google-mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#4285f4;font-size:16px;font-weight:900}.login-trust{color:var(--muted);font-size:10px;line-height:1.55;text-align:center;padding:10px 8px 18px}.password-fallback{margin-top:4px}.password-fallback>summary{text-align:center;color:var(--muted);font-size:10px}.password-fallback>.details-body{display:grid;padding:14px;background:var(--panel-2)}

    .detail-page{min-height:100vh}.detail-topbar{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1200px)/2));background:var(--panel);position:sticky;top:0;z-index:10}.detail-content{max-width:1200px;margin:0 auto;padding:28px 20px 48px}.letter-preview{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:13px/1.7 ui-sans-serif,system-ui;color:var(--text)}

    .hidden-by-filter{display:none!important}
    @media(max-width:1250px){.grid-6{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:900px){
      .app-shell{display:block}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(286px,86vw);height:100vh;transform:translateX(-105%);transition:.2s ease;box-shadow:var(--shadow);z-index:60}.sidebar.is-open{transform:none}.workspace{width:100%}.topbar{height:64px;padding:0 16px}.content{padding:20px 16px 40px}.mobile-menu{display:inline-flex}.grid-3,.grid-2,.control-grid{grid-template-columns:1fr}.section-heading{align-items:flex-start}.source-card{flex-direction:column}.source-actions{justify-content:flex-start;width:100%}
      body.sidebar-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
    }
    @media(max-width:620px){.grid-6,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.section-heading{display:block}.section-actions{margin-top:12px}.metric-card{min-height:104px}.metric-value{font-size:23px}.status-strip{align-items:flex-start;flex-wrap:wrap}.status-strip .push{margin-left:22px}.activity-item{grid-template-columns:64px minmax(0,1fr)}.activity-item>.badge{grid-column:2}.login-card{padding:22px}.detail-content{padding:20px 12px}.topbar-title span{display:none}}
  </style>
  <script src="/admin-assets/admin.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
