<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="{{ admin_asset_url('favicon.svg') }}" type="image/svg+xml">
  <title>{% block title %}JobHunter{% endblock %}</title>
  <link rel="stylesheet" href="{{ admin_asset_url('panel.css') }}">
  <script src="{{ admin_asset_url('admin.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <dialog class="confirm-dialog" data-confirm-dialog aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="confirm-shell">
      <div class="confirm-head">
        <div class="confirm-icon" data-confirm-icon aria-hidden="true">?</div>
        <div class="confirm-copy"><h2 id="confirm-title" data-confirm-title>Подтвердите действие</h2><p id="confirm-message" data-confirm-message></p></div>
      </div>
      <label class="confirm-reason" data-confirm-reason-field hidden>Причина — необязательно<textarea data-confirm-reason-input maxlength="500" placeholder="Например: не подходит график или направление"></textarea></label>
      <fieldset class="review-reason" data-review-reason-field hidden><legend>Почему вакансия не подходит?</legend><div class="review-reason-options">
        <label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="role"><span>Должность</span></label><label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="salary"><span>Зарплата</span></label><label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="schedule"><span>График</span></label><label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="location"><span>Место</span></label><label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="company"><span>Компания</span></label><label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="requirements"><span>Требования</span></label><label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="vacancy_problem"><span>Вакансия закрыта или сломана</span></label><label class="review-reason-option"><input type="radio" name="dialog-review-reason" value="other" checked><span>Другое</span></label>
      </div><label class="review-learn"><input type="checkbox" data-review-learn checked>Учитывать решение при разборе следующих вакансий</label></fieldset>
      <div class="confirm-actions"><button class="btn" type="button" data-confirm-cancel>Отмена</button><button class="btn btn-primary" type="button" data-confirm-accept>Подтвердить</button></div>
    </div>
  </dialog>
  {% block scripts %}{% endblock %}
</body>
</html>
