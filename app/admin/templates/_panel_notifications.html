{% if panel.is_admin %}
{% include "_admin_notifications.html" %}
{% else %}
<details class="notification-center" data-notifications>
  <summary class="btn btn-icon" aria-label="Уведомления" title="Уведомления"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg>{% if notifications %}<span class="notification-count">{{ notifications|length }}</span>{% endif %}</summary>
  <div class="notification-popover" role="region" aria-label="Последние уведомления">
    <div class="notification-head"><strong>Уведомления</strong><span class="badge {{ 'warning' if notifications else 'success' }}">{{ notifications|length }}</span></div>
    <div class="notification-list">{% for item in notifications %}<a class="notification-item" href="{{ item.href }}"><span class="status-dot {{ item.tone }}"></span><span><strong>{{ item.title }}</strong><small>{{ item.detail }}</small></span></a>{% else %}<div class="notification-empty">Новых уведомлений нет.</div>{% endfor %}</div>
  </div>
</details>
{% endif %}
