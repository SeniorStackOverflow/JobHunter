<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}JobHunter{% endblock %}</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#0f1117;color:#eef1f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f1117;color:#eef1f7}
    a{color:inherit}.page{width:min(900px,calc(100% - 32px));margin:0 auto;padding:48px 0}
    .card{background:#171a22;border:1px solid #2a2f3b;border-radius:18px;padding:24px;margin-bottom:16px}
    .stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    h1,h2{margin:0 0 8px}p{color:#aeb6c5}.muted{color:#8d96a8}.danger{color:#ff8793}.ok{color:#67dba5}
    input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #343b49;background:#10131a;color:#eef1f7}
    .btn{display:inline-flex;justify-content:center;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid #3c4556;background:#242a36;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}
    .btn-primary{background:#625df5;border-color:#625df5}.btn-danger{background:#672c34;border-color:#8e3945}
    form{display:grid;gap:12px}.token{word-break:break-all;padding:12px;border-radius:10px;background:#0f1218;border:1px solid #303746;font-family:monospace}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #2a2f3b}
  </style>
</head>
<body><main class="page">{% block body %}{% endblock %}</main></body>
</html>
